<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGS TEST - ИСПРАВЛЕННАЯ АНИМАЦИЯ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(145deg, #0B1120 0%, #192132 100%);
            min-height: 100vh;
            padding: 30px 20px;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 3em;
            background: linear-gradient(145deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 48px;
            padding: 40px;
            color: #1a1f2e;
        }
        .status {
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 20px;
            background: #f0f9ff;
            border: 2px solid #38bdf8;
        }
        .debug-panel {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            color: #e2e8f0;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
        }
        .success { color: #4ade80; }
        .error { color: #ef4444; }
        button {
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 40px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 10px;
            width: 200px;
        }
        button.test2 { background: linear-gradient(145deg, #3b82f6, #1e40af); }
        button.test3 { background: linear-gradient(145deg, #10b981, #047857); }
        button.test4 { background: linear-gradient(145deg, #f59e0b, #b45309); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 TGS FIXED</h1>
            <p>Тестирование анимации</p>
        </div>
        
        <div class="card">
            <div class="status" id="status">
                ✅ Нажимайте кнопки для тестов
            </div>
            
            <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                <button onclick="test1_static()">🔴 1. Статичный круг</button>
                <button class="test2" onclick="test2_scale()">📏 2. Пульсация</button>
                <button class="test3" onclick="test3_move()">↗️ 3. Движение</button>
                <button class="test4" onclick="test4_rotate()">🔄 4. Вращение</button>
                <button onclick="test5_combo()">✨ 5. Комбо</button>
            </div>
            
            <div class="debug-panel" id="debug">
                <div id="logs"></div>
            </div>
            
            <p style="margin-top: 20px; font-size: 0.9em; color: #666;">
                После создания загрузите TGS в Telegram (@Stickers bot)
            </p>
        </div>
    </div>

    <script>
        function log(msg, type = 'info') {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'success' ? '#4ade80' : (type === 'error' ? '#ef4444' : '#94a3b8');
            logs.innerHTML += `<div><span style="color: #fbbf24;">[${timestamp}]</span> <span style="color: ${color};">${msg}</span></div>`;
            logs.scrollTop = logs.scrollHeight;
            
            const status = document.getElementById('status');
            status.innerHTML = `🔄 ${msg}`;
        }

        // ========== ТЕСТ 1: СТАТИЧНЫЙ КРУГ (БАЗА) ==========
        async function test1_static() {
            log('🔴 Тест 1: Статичный круг (без анимации)');
            
            const lottie = {
                tgs: 1,
                v: "5.5.2",
                fr: 60,
                ip: 0,
                op: 60,
                w: 512,
                h: 512,
                ddd: 0,
                layers: [{
                    ddd: 0,
                    ind: 1,
                    ty: 4,
                    nm: "circle",
                    sr: 1,
                    ks: {
                        o: { a: 0, k: 100 },
                        r: { a: 0, k: 0 },
                        p: { a: 0, k: [256, 256, 0] },
                        a: { a: 0, k: [0, 0, 0] },
                        s: { a: 0, k: [100, 100, 100] }
                    },
                    shapes: [{
                        ty: "gr",
                        it: [
                            {
                                ty: "el",
                                p: { a: 0, k: [0, 0] },
                                s: { a: 0, k: [200, 200] }
                            },
                            {
                                ty: "fl",
                                c: { a: 0, k: [1, 0, 0, 1] }, // Красный
                                o: { a: 0, k: 100 }
                            }
                        ]
                    }],
                    ip: 0,
                    op: 60
                }]
            };
            
            await saveTGS(lottie, 'test1_static.tgs');
        }

        // ========== ТЕСТ 2: ПУЛЬСАЦИЯ (SCALE) ==========
        async function test2_scale() {
            log('📏 Тест 2: Пульсация (scale)');
            
            const lottie = {
                tgs: 1,
                v: "5.5.2",
                fr: 60,
                ip: 0,
                op: 120,  // 2 секунды при 60 fps
                w: 512,
                h: 512,
                ddd: 0,
                layers: [{
                    ddd: 0,
                    ind: 1,
                    ty: 4,
                    nm: "pulsing_circle",
                    sr: 1,
                    ks: {
                        o: { a: 0, k: 100 },
                        r: { a: 0, k: 0 },
                        p: { a: 0, k: [256, 256, 0] },
                        a: { a: 0, k: [0, 0, 0] },
                        s: { 
                            a: 1,  // Включена анимация
                            k: [
                                { t: 0, s: [100, 100, 100] },
                                { t: 30, s: [150, 150, 100] },  // Увеличение
                                { t: 60, s: [100, 100, 100] },  // Возврат
                                { t: 90, s: [150, 150, 100] },  // Снова
                                { t: 120, s: [100, 100, 100] }  // Возврат
                            ]
                        }
                    },
                    shapes: [{
                        ty: "gr",
                        it: [
                            {
                                ty: "el",
                                p: { a: 0, k: [0, 0] },
                                s: { a: 0, k: [200, 200] }
                            },
                            {
                                ty: "fl",
                                c: { a: 0, k: [0, 0, 1, 1] }, // Синий
                                o: { a: 0, k: 100 }
                            }
                        ]
                    }],
                    ip: 0,
                    op: 120
                }]
            };
            
            await saveTGS(lottie, 'test2_scale.tgs');
        }

        // ========== ТЕСТ 3: ДВИЖЕНИЕ (POSITION) ==========
        async function test3_move() {
            log('↗️ Тест 3: Движение (position)');
            
            const lottie = {
                tgs: 1,
                v: "5.5.2",
                fr: 60,
                ip: 0,
                op: 120,
                w: 512,
                h: 512,
                ddd: 0,
                layers: [{
                    ddd: 0,
                    ind: 1,
                    ty: 4,
                    nm: "moving_circle",
                    sr: 1,
                    ks: {
                        o: { a: 0, k: 100 },
                        r: { a: 0, k: 0 },
                        p: {  // Position с анимацией
                            a: 1,
                            k: [
                                { t: 0, s: [256, 256, 0] },
                                { t: 30, s: [356, 256, 0] },  // Вправо
                                { t: 60, s: [256, 356, 0] },  // Вниз
                                { t: 90, s: [156, 256, 0] },  // Влево
                                { t: 120, s: [256, 156, 0] }, // Вверх
                                { t: 150, s: [256, 256, 0] }  // Назад
                            ]
                        },
                        a: { a: 0, k: [0, 0, 0] },
                        s: { a: 0, k: [100, 100, 100] }
                    },
                    shapes: [{
                        ty: "gr",
                        it: [
                            {
                                ty: "el",
                                p: { a: 0, k: [0, 0] },
                                s: { a: 0, k: [150, 150] }
                            },
                            {
                                ty: "fl",
                                c: { a: 0, k: [0, 1, 0, 1] }, // Зеленый
                                o: { a: 0, k: 100 }
                            }
                        ]
                    }],
                    ip: 0,
                    op: 150
                }]
            };
            
            await saveTGS(lottie, 'test3_move.tgs');
        }

        // ========== ТЕСТ 4: ВРАЩЕНИЕ (ROTATION) ==========
        async function test4_rotate() {
            log('🔄 Тест 4: Вращение (rotation)');
            
            const lottie = {
                tgs: 1,
                v: "5.5.2",
                fr: 60,
                ip: 0,
                op: 120,
                w: 512,
                h: 512,
                ddd: 0,
                layers: [{
                    ddd: 0,
                    ind: 1,
                    ty: 4,
                    nm: "rotating_square",
                    sr: 1,
                    ks: {
                        o: { a: 0, k: 100 },
                        r: {  // Rotation с анимацией
                            a: 1,
                            k: [
                                { t: 0, s: [0] },
                                { t: 30, s: [90] },
                                { t: 60, s: [180] },
                                { t: 90, s: [270] },
                                { t: 120, s: [360] }
                            ]
                        },
                        p: { a: 0, k: [256, 256, 0] },
                        a: { a: 0, k: [0, 0, 0] },
                        s: { a: 0, k: [100, 100, 100] }
                    },
                    shapes: [{
                        ty: "gr",
                        it: [
                            {
                                ty: "rc",  // Прямоугольник
                                s: { a: 0, k: [200, 200] },
                                p: { a: 0, k: [0, 0] },
                                r: { a: 0, k: 0 }
                            },
                            {
                                ty: "fl",
                                c: { a: 0, k: [1, 1, 0, 1] }, // Желтый
                                o: { a: 0, k: 100 }
                            }
                        ]
                    }],
                    ip: 0,
                    op: 120
                }]
            };
            
            await saveTGS(lottie, 'test4_rotate.tgs');
        }

        // ========== ТЕСТ 5: ВСЁ ВМЕСТЕ ==========
        async function test5_combo() {
            log('✨ Тест 5: Комбинированная анимация');
            
            const lottie = {
                tgs: 1,
                v: "5.5.2",
                fr: 60,
                ip: 0,
                op: 180,
                w: 512,
                h: 512,
                ddd: 0,
                layers: [
                    // Слой 1: Фоновый квадрат
                    {
                        ddd: 0,
                        ind: 1,
                        ty: 4,
                        nm: "background",
                        sr: 1,
                        ks: {
                            o: { a: 1, k: [
                                { t: 0, s: [100] },
                                { t: 90, s: [50] },
                                { t: 180, s: [100] }
                            ]},
                            r: { a: 0, k: 0 },
                            p: { a: 0, k: [256, 256, 0] },
                            a: { a: 0, k: [0, 0, 0] },
                            s: { a: 1, k: [
                                { t: 0, s: [100, 100, 100] },
                                { t: 90, s: [120, 120, 100] },
                                { t: 180, s: [100, 100, 100] }
                            ]}
                        },
                        shapes: [{
                            ty: "gr",
                            it: [
                                {
                                    ty: "rc",
                                    s: { a: 0, k: [400, 400] },
                                    p: { a: 0, k: [256, 256] },
                                    r: { a: 0, k: 50 }
                                },
                                {
                                    ty: "fl",
                                    c: { a: 0, k: [0.5, 0, 0.5, 1] } // Фиолетовый
                                }
                            ]
                        }],
                        ip: 0,
                        op: 180
                    },
                    // Слой 2: Круг
                    {
                        ddd: 0,
                        ind: 2,
                        ty: 4,
                        nm: "circle",
                        sr: 1,
                        ks: {
                            o: { a: 0, k: 100 },
                            r: { a: 1, k: [
                                { t: 0, s: [0] },
                                { t: 180, s: [360] }
                            ]},
                            p: { a: 1, k: [
                                { t: 0, s: [256, 256, 0] },
                                { t: 60, s: [356, 256, 0] },
                                { t: 120, s: [156, 256, 0] },
                                { t: 180, s: [256, 256, 0] }
                            ]},
                            a: { a: 0, k: [0, 0, 0] },
                            s: { a: 1, k: [
                                { t: 0, s: [100, 100, 100] },
                                { t: 90, s: [150, 150, 100] },
                                { t: 180, s: [100, 100, 100] }
                            ]}
                        },
                        shapes: [{
                            ty: "gr",
                            it: [
                                {
                                    ty: "el",
                                    p: { a: 0, k: [0, 0] },
                                    s: { a: 0, k: [150, 150] }
                                },
                                {
                                    ty: "fl",
                                    c: { a: 0, k: [0, 1, 1, 1] } // Голубой
                                }
                            ]
                        }],
                        ip: 0,
                        op: 180
                    }
                ]
            };
            
            await saveTGS(lottie, 'test5_combo.tgs');
        }

        // ========== СОХРАНЕНИЕ TGS ==========
        async function saveTGS(lottieJson, filename) {
            try {
                // Подробная информация
                log(`📦 JSON размер: ${JSON.stringify(lottieJson).length} байт`);
                log(`📊 Слоев: ${lottieJson.layers.length}`);
                
                // Проверяем наличие анимации
                let hasAnimation = false;
                lottieJson.layers.forEach((layer, i) => {
                    if (layer.ks.s && layer.ks.s.a === 1) hasAnimation = true;
                    if (layer.ks.p && layer.ks.p.a === 1) hasAnimation = true;
                    if (layer.ks.r && layer.ks.r.a === 1) hasAnimation = true;
                    if (layer.ks.o && layer.ks.o.a === 1) hasAnimation = true;
                });
                log(`🎬 Анимация: ${hasAnimation ? 'Есть' : 'Нет'}`);
                
                // Сжимаем
                const jsonString = JSON.stringify(lottieJson);
                const compressed = pako.gzip(jsonString, { level: 9 });
                log(`✅ Сжато: ${jsonString.length} → ${compressed.length} байт`, 'success');
                
                // Создаем blob
                const blob = new Blob([compressed], { type: 'application/x-tgsticker' });
                
                // Сохраняем
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                log(`✅ Файл сохранен: ${filename}`, 'success');
                
            } catch (e) {
                log(`❌ Ошибка: ${e.message}`, 'error');
            }
        }

        // Начальный лог
        log('✅ TGS тестер загружен');
        log('Нажимайте кнопки по порядку:');
        log('1. Статичный круг - базовая проверка');
        log('2. Пульсация - проверка scale анимации');
        log('3. Движение - проверка position анимации');
        log('4. Вращение - проверка rotation анимации');
        log('5. Комбо - все вместе');
    </script>
</body>
</html>
