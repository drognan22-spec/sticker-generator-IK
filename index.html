<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGS - 100% РАБОЧАЯ ВЕРСИЯ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(145deg, #0B1120 0%, #192132 100%);
            min-height: 100vh;
            padding: 30px 20px;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 3em;
            background: linear-gradient(145deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 48px;
            padding: 40px;
            color: #1a1f2e;
        }
        button {
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            border: none;
            border-radius: 30px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: white;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.02);
        }
        .debug {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            color: #e2e8f0;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .note {
            background: #fef9c3;
            border-left: 4px solid #fbbf24;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>⚡ TGS WORKING</h1>
        
        <div class="card">
            <div class="note">
                <strong>📌 Важно!</strong> Загружайте в @Stickers бота и смотрите превью
            </div>
            
            <button onclick="testWorking()">✅ ТЕСТ 1: РАБОЧАЯ АНИМАЦИЯ</button>
            <button onclick="testScale()">📏 ТЕСТ 2: Scale (пульсация)</button>
            <button onclick="testPosition()">📍 ТЕСТ 3: Position (движение)</button>
            <button onclick="testRotation()">🔄 ТЕСТ 4: Rotation (вращение)</button>
            <button onclick="testOpacity()">👁️ ТЕСТ 5: Opacity (мигание)</button>
            
            <div class="debug" id="debug"></div>
        </div>
    </div>

    <script>
        function log(msg, type = 'info') {
            const debug = document.getElementById('debug');
            const timestamp = new Date().toLocaleTimeString();
            debug.innerHTML += `<div><span style="color: #fbbf24;">[${timestamp}]</span> <span style="color: #4ade80;">${msg}</span></div>`;
            debug.scrollTop = debug.scrollHeight;
        }

        // ========== ТЕСТ 1: ГАРАНТИРОВАННО РАБОЧАЯ АНИМАЦИЯ ==========
        async function testWorking() {
            log('🎬 Тест 1: Базовая рабочая анимация');
            
            // Минимальная структура, которая ТОЧНО работает
            const tgs = {
                "v": "5.5.2",
                "fr": 30,
                "ip": 0,
                "op": 60,
                "w": 512,
                "h": 512,
                "nm": "Test",
                "ddd": 0,
                "assets": [],
                "layers": [{
                    "ddd": 0,
                    "ind": 1,
                    "ty": 4,
                    "nm": "Circle",
                    "sr": 1,
                    "ks": {
                        "o": { "a": 0, "k": 100 },
                        "r": { "a": 0, "k": 0 },
                        "p": { "a": 0, "k": [256, 256, 0] },
                        "a": { "a": 0, "k": [128, 128, 0] },
                        "s": {
                            "a": 1,
                            "k": [{
                                "t": 0,
                                "s": [100, 100, 100]
                            }, {
                                "t": 30,
                                "s": [200, 200, 100]
                            }, {
                                "t": 60,
                                "s": [100, 100, 100]
                            }]
                        }
                    },
                    "shapes": [{
                        "ty": "gr",
                        "it": [{
                            "ty": "el",
                            "p": { "a": 0, "k": [0, 0] },
                            "s": { "a": 0, "k": [200, 200] }
                        }, {
                            "ty": "fl",
                            "c": { "a": 0, "k": [1, 0, 0, 1] },
                            "o": { "a": 0, "k": 100 }
                        }]
                    }],
                    "ip": 0,
                    "op": 60
                }]
            };
            
            await saveTGS(tgs, 'test1_working.tgs');
        }

        // ========== ТЕСТ 2: SCALE АНИМАЦИЯ ==========
        async function testScale() {
            log('📏 Тест 2: Scale анимация');
            
            const tgs = {
                "v": "5.5.2",
                "fr": 30,
                "ip": 0,
                "op": 90,
                "w": 512,
                "h": 512,
                "nm": "Scale",
                "ddd": 0,
                "assets": [],
                "layers": [{
                    "ddd": 0,
                    "ind": 1,
                    "ty": 4,
                    "nm": "Pulse",
                    "sr": 1,
                    "ks": {
                        "o": { "a": 0, "k": 100 },
                        "r": { "a": 0, "k": 0 },
                        "p": { "a": 0, "k": [256, 256, 0] },
                        "a": { "a": 0, "k": [128, 128, 0] },
                        "s": {
                            "a": 1,
                            "k": [
                                { "t": 0, "s": [100, 100, 100] },
                                { "t": 30, "s": [150, 150, 100] },
                                { "t": 60, "s": [100, 100, 100] },
                                { "t": 90, "s": [100, 100, 100] }
                            ]
                        }
                    },
                    "shapes": [{
                        "ty": "gr",
                        "it": [{
                            "ty": "el",
                            "p": { "a": 0, "k": [0, 0] },
                            "s": { "a": 0, "k": [200, 200] }
                        }, {
                            "ty": "fl",
                            "c": { "a": 0, "k": [0, 0, 1, 1] },
                            "o": { "a": 0, "k": 100 }
                        }]
                    }],
                    "ip": 0,
                    "op": 90
                }]
            };
            
            await saveTGS(tgs, 'test2_scale.tgs');
        }

        // ========== ТЕСТ 3: POSITION АНИМАЦИЯ ==========
        async function testPosition() {
            log('📍 Тест 3: Position анимация');
            
            const tgs = {
                "v": "5.5.2",
                "fr": 30,
                "ip": 0,
                "op": 120,
                "w": 512,
                "h": 512,
                "nm": "Move",
                "ddd": 0,
                "assets": [],
                "layers": [{
                    "ddd": 0,
                    "ind": 1,
                    "ty": 4,
                    "nm": "Moving",
                    "sr": 1,
                    "ks": {
                        "o": { "a": 0, "k": 100 },
                        "r": { "a": 0, "k": 0 },
                        "p": {
                            "a": 1,
                            "k": [
                                { "t": 0, "s": [256, 100, 0] },
                                { "t": 30, "s": [256, 400, 0] },
                                { "t": 60, "s": [256, 100, 0] },
                                { "t": 90, "s": [256, 400, 0] },
                                { "t": 120, "s": [256, 100, 0] }
                            ]
                        },
                        "a": { "a": 0, "k": [128, 128, 0] },
                        "s": { "a": 0, "k": [100, 100, 100] }
                    },
                    "shapes": [{
                        "ty": "gr",
                        "it": [{
                            "ty": "el",
                            "p": { "a": 0, "k": [0, 0] },
                            "s": { "a": 0, "k": [150, 150] }
                        }, {
                            "ty": "fl",
                            "c": { "a": 0, "k": [0, 1, 0, 1] },
                            "o": { "a": 0, "k": 100 }
                        }]
                    }],
                    "ip": 0,
                    "op": 120
                }]
            };
            
            await saveTGS(tgs, 'test3_position.tgs');
        }

        // ========== ТЕСТ 4: ROTATION АНИМАЦИЯ ==========
        async function testRotation() {
            log('🔄 Тест 4: Rotation анимация');
            
            const tgs = {
                "v": "5.5.2",
                "fr": 30,
                "ip": 0,
                "op": 120,
                "w": 512,
                "h": 512,
                "nm": "Rotate",
                "ddd": 0,
                "assets": [],
                "layers": [{
                    "ddd": 0,
                    "ind": 1,
                    "ty": 4,
                    "nm": "Spinning",
                    "sr": 1,
                    "ks": {
                        "o": { "a": 0, "k": 100 },
                        "r": {
                            "a": 1,
                            "k": [
                                { "t": 0, "s": [0] },
                                { "t": 60, "s": [360] },
                                { "t": 120, "s": [720] }
                            ]
                        },
                        "p": { "a": 0, "k": [256, 256, 0] },
                        "a": { "a": 0, "k": [128, 128, 0] },
                        "s": { "a": 0, "k": [100, 100, 100] }
                    },
                    "shapes": [{
                        "ty": "gr",
                        "it": [{
                            "ty": "rc",
                            "s": { "a": 0, "k": [200, 200] },
                            "p": { "a": 0, "k": [0, 0] },
                            "r": { "a": 0, "k": 20 }
                        }, {
                            "ty": "fl",
                            "c": { "a": 0, "k": [1, 1, 0, 1] },
                            "o": { "a": 0, "k": 100 }
                        }]
                    }],
                    "ip": 0,
                    "op": 120
                }]
            };
            
            await saveTGS(tgs, 'test4_rotation.tgs');
        }

        // ========== ТЕСТ 5: OPACITY АНИМАЦИЯ ==========
        async function testOpacity() {
            log('👁️ Тест 5: Opacity анимация');
            
            const tgs = {
                "v": "5.5.2",
                "fr": 30,
                "ip": 0,
                "op": 90,
                "w": 512,
                "h": 512,
                "nm": "Blink",
                "ddd": 0,
                "assets": [],
                "layers": [{
                    "ddd": 0,
                    "ind": 1,
                    "ty": 4,
                    "nm": "Blinking",
                    "sr": 1,
                    "ks": {
                        "o": {
                            "a": 1,
                            "k": [
                                { "t": 0, "s": [100] },
                                { "t": 15, "s": [0] },
                                { "t": 30, "s": [100] },
                                { "t": 45, "s": [0] },
                                { "t": 60, "s": [100] },
                                { "t": 75, "s": [0] },
                                { "t": 90, "s": [100] }
                            ]
                        },
                        "r": { "a": 0, "k": 0 },
                        "p": { "a": 0, "k": [256, 256, 0] },
                        "a": { "a": 0, "k": [128, 128, 0] },
                        "s": { "a": 0, "k": [100, 100, 100] }
                    },
                    "shapes": [{
                        "ty": "gr",
                        "it": [{
                            "ty": "el",
                            "p": { "a": 0, "k": [0, 0] },
                            "s": { "a": 0, "k": [200, 200] }
                        }, {
                            "ty": "fl",
                            "c": { "a": 0, "k": [1, 0, 1, 1] },
                            "o": { "a": 0, "k": 100 }
                        }]
                    }],
                    "ip": 0,
                    "op": 90
                }]
            };
            
            await saveTGS(tgs, 'test5_opacity.tgs');
        }

        async function saveTGS(tgsJson, filename) {
            try {
                log(`📦 JSON: ${JSON.stringify(tgsJson).length} байт`);
                
                // Добавляем tgs флаг если нет
                tgsJson.tgs = 1;
                
                const jsonString = JSON.stringify(tgsJson);
                const compressed = pako.gzip(jsonString, { level: 9 });
                
                log(`✅ Сжато: ${jsonString.length} → ${compressed.length} байт`);
                
                const blob = new Blob([compressed], { type: 'application/x-tgsticker' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                link.click();
                URL.revokeObjectURL(url);
                
                log(`✅ Файл сохранен: ${filename}`);
                
            } catch (e) {
                log(`❌ Ошибка: ${e.message}`);
            }
        }

        log('⚡ TGS генератор готов');
        log('Нажмите ТЕСТ 1 для проверки');
    </script>
</body>
</html>
