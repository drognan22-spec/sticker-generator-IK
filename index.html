        // ========== ROBOFLOW API ЗАПРОС ==========
        async function analyzeImageWithRoboflow(imageBase64) {
            addDebugLog('request', 'Начинаем анализ изображения через Roboflow...');
            
            try {
                const base64Data = imageBase64.split(',')[1];
                
                const url = `https://detect.roboflow.com/${ROBOFLOW_MODEL}?api_key=${ROBOFLOW_API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: base64Data
                });

                if (!response.ok) {
                    return generateDefaultZones();
                }

                const data = await response.json();
                return processSegmentationResponse(data);
                
            } catch (error) {
                addDebugLog('error', 'Ошибка Roboflow API:', { error: error.message });
                return generateDefaultZones();
            }
        }

        function processSegmentationResponse(data) {
            const zones = [];
            
            if (data.predictions && data.predictions.length > 0) {
                data.predictions.forEach((pred, index) => {
                    const className = pred.class || 'object';
                    
                    let animationType = 'object';
                    if (className === 'person') {
                        animationType = 'human';
                    } else if (['cat', 'dog', 'horse', 'sheep', 'cow', 'bird'].includes(className)) {
                        animationType = 'animal';
                    }
                    
                    zones.push({
                        id: index,
                        type: animationType,
                        x: pred.x || 256,
                        y: pred.y || 256,
                        width: pred.width || 100,
                        height: pred.height || 100,
                        confidence: pred.confidence || 0.7
                    });
                });
            }
            
            return zones.length > 0 ? zones : generateDefaultZones();
        }

        function generateDefaultZones() {
            return [
                { id: 0, type: 'object', x: 256, y: 180, width: 120, height: 200, confidence: 1.0 },
                { id: 1, type: 'object', x: 256, y: 120, width: 80, height: 80, confidence: 1.0 },
                { id: 2, type: 'object', x: 256, y: 110, width: 40, height: 20, confidence: 1.0 }
            ];
        }

        // ========== СОЗДАНИЕ АНИМАЦИИ ==========
        function createAnimationFromZones(pngBase64, zones, emotionIndex) {
            const base64Data = pngBase64.split(',')[1];
            
            const lottieJson = {
                v: "5.5.7",
                fr: 60,
                ip: 0,
                op: 180,
                w: 512,
                h: 512,
                assets: [{
                    id: "sticker_img",
                    w: 512,
                    h: 512,
                    p: `data:image/png;base64,${base64Data}`,
                    e: 1
                }],
                layers: []
            };

            let layerIndex = 1;
            
            zones.forEach((zone, i) => {
                let animationType;
                if (zone.type === 'human') {
                    animationType = createHumanAnimation(zone, emotionIndex + i);
                } else if (zone.type === 'animal') {
                    animationType = createAnimalAnimation(zone, emotionIndex + i);
                } else {
                    animationType = createObjectAnimation(zone, emotionIndex + i);
                }
                
                lottieJson.layers.push({
                    ind: layerIndex++,
                    ty: 2,
                    refId: "sticker_img",
                    nm: `zone_${i}`,
                    ks: animationType,
                    ip: 0,
                    op: 180
                });
            });

            return lottieJson;
        }

        function createHumanAnimation(zone, seed) {
            return {
                o: { a: 0, k: 100 },
                r: createWaveAnimation(0.6, 2.5, seed),
                p: createPositionAnimation(zone.x, zone.y, 4, seed),
                a: { a: 0, k: [zone.x, zone.y, 0] },
                s: createScaleAnimation(0.4, seed)
            };
        }

        function createAnimalAnimation(zone, seed) {
            return {
                o: { a: 0, k: 100 },
                r: createWaveAnimation(0.8, 3, seed),
                p: createPositionAnimation(zone.x, zone.y, 5, seed),
                a: { a: 0, k: [zone.x, zone.y, 0] },
                s: createScaleAnimation(0.5, seed)
            };
        }

        function createObjectAnimation(zone, seed) {
            return {
                o: { a: 0, k: 100 },
                r: createWaveAnimation(0.4, 2, seed),
                p: createPositionAnimation(zone.x, zone.y, 2, seed),
                a: { a: 0, k: [zone.x, zone.y, 0] },
                s: createScaleAnimation(0.2, seed)
            };
        }

        function createWaveAnimation(amp, freq, phase) {
            const keyframes = [];
            for (let i = 0; i <= 12; i++) {
                const frame = Math.round((i / 12) * 180);
                const value = Math.sin((frame / 180) * Math.PI * 2 * freq + phase) * amp * 8;
                keyframes.push({ t: frame, s: [value] });
            }
            return { a: 1, k: keyframes };
        }

        function createPositionAnimation(baseX, baseY, amplitude, seed) {
            const keyframes = [];
            for (let i = 0; i <= 8; i++) {
                const frame = Math.round((i / 8) * 180);
                const offsetX = Math.sin((frame / 180) * Math.PI * 2 + seed) * amplitude;
                const offsetY = Math.cos((frame / 180) * Math.PI * 2 + seed) * amplitude;
                keyframes.push({
                    t: frame,
                    s: [baseX + offsetX, baseY + offsetY, 0]
                });
            }
            return { a: 1, k: keyframes };
        }

        function createScaleAnimation(intensity, seed) {
            const keyframes = [];
            for (let i = 0; i <= 8; i++) {
                const frame = Math.round((i / 8) * 180);
                const scale = 100 + Math.sin((frame / 180) * Math.PI * 4 + seed) * intensity;
                keyframes.push({
                    t: frame,
                    s: [scale, scale, 100]
                });
            }
            return { a: 1, k: keyframes };
        }

        async function convertPngToTgs(pngDataUrl, zones, index) {
            try {
                const lottieJson = createAnimationFromZones(pngDataUrl, zones, index);
                const jsonString = JSON.stringify(lottieJson);
                const compressedData = pako.gzip(jsonString);
                const tgsBlob = new Blob([compressedData], { type: 'application/octet-stream' });
                
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(tgsBlob);
                });
            } catch (error) {
                console.error('TGS error:', error);
                return null;
            }
        }

        async function generateRecraftImage(prompt) {
            try {
                const response = await fetch('https://external.api.recraft.ai/v1/images/generations', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${RECRAFT_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        n: 1,
                        size: '1024x1024',
                        response_format: 'b64_json'
                    })
                });

                if (!response.ok) {
                    return null;
                }

                const data = await response.json();
                
                if (data.data && data.data[0] && data.data[0].b64_json) {
                    return await resizeImageTo512(data.data[0].b64_json);
                }
                return null;
            } catch (error) {
                console.error('Recraft error:', error);
                return null;
            }
        }

        function resizeImageTo512(base64Image) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 512, 512);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.src = `data:image/png;base64,${base64Image}`;
            });
        }

        function generateDemoImage(emotion, professionName, humorText) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            const hue = EMOTIONS.findIndex(e => e.id === emotion.id) * 12 % 360;
            const gradient = ctx.createLinearGradient(0, 0, 512, 512);
            gradient.addColorStop(0, `hsl(${hue}, 80%, 70%)`);
            gradient.addColorStop(1, `hsl(${hue + 40}, 80%, 60%)`);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(256, 200, 120, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#333';
            ctx.font = 'bold 40px Arial';
            ctx.fillText(emotion.icon, 200, 150);
            ctx.font = 'bold 24px Arial';
            ctx.fillText(professionName, 200, 200);
            ctx.font = 'bold 18px Arial';
            
            // Отображаем короткую версию юмора
            const shortHumor = humorText ? humorText.substring(0, 30) + '...' : emotion.name;
            ctx.fillText(shortHumor, 150, 280);
            ctx.font = 'bold 14px Arial';
            ctx.fillStyle = '#666';
            ctx.fillText('(профессиональный юмор)', 150, 320);
            
            return canvas.toDataURL('image/png');
        }

        window.generatePack = async () => {
            const character = document.getElementById('characterPrompt').value.trim();
            
            if (!character || !selectedProfession || selectedEmotions.length === 0) {
                alert('Пожалуйста, выберите персонажа, профессию и эмоции');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('results').innerHTML = '';

            try {
                generatedPNG = [];
                generatedTGS = [];
                
                const profession = PROFESSIONS.find(p => p.id === selectedProfession);

                for (let i = 0; i < selectedEmotions.length; i++) {
                    const emotionId = selectedEmotions[i];
                    const emotion = EMOTIONS.find(e => e.id === emotionId);
                    
                    document.getElementById('loadingProgress').textContent = 
                        `Генерируем стикер ${i+1} из ${selectedEmotions.length}: ${profession.name} - ${emotion.name}`;
                    
                    // Генерируем промпт с атрибутами профессии и юмором
                    const prompt = generateProfessionPrompt(profession, emotion.prompt, character);
                    
                    let pngImage = await generateRecraftImage(prompt);
                    
                    // Для демо показываем с юмором
                    const humorText = profession.humor ? 
                        profession.humor[Math.floor(Math.random() * profession.humor.length)] : '';
                    
                    if (!pngImage) {
                        pngImage = generateDemoImage(emotion, profession.name, humorText);
                    }
                    
                    generatedPNG.push({
                        emotion: emotion,
                        profession: profession.name,
                        dataUrl: pngImage,
                        filename: `${character}_${profession.id}_${emotion.id}_${i}.png`,
                        humor: humorText
                    });
                    
                    if (selectedPack === 'premium') {
                        document.getElementById('loadingProgress').textContent = 
                            `Создаем анимацию ${i+1}: ${emotion.name}`;
                        
                        const zones = await analyzeImageWithRoboflow(pngImage);
                        const tgsData = await convertPngToTgs(pngImage, zones, i);
                        
                        generatedTGS.push({
                            emotion: emotion,
                            profession: profession.name,
                            dataUrl: tgsData || pngImage,
                            filename: `${character}_${profession.id}_${emotion.id}_${i}.tgs`,
                            humor: humorText
                        });
                    }
                }

                displayResults(generatedPNG, generatedTGS, profession);
                
                addToHistory(character, profession, currentStyle, selectedEmotions.length, generatedPNG, generatedTGS, selectedPack);
                
            } catch (error) {
                alert('Ошибка: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('generateBtn').disabled = false;
            }
        };

        function displayResults(pngStickers, tgsStickers, profession) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            const title = document.createElement('h2');
            title.style.cssText = 'font-size: 2em; color: white; margin-bottom: 20px;';
            title.innerHTML = `🎉 Готово! ${pngStickers.length} стикеров с профессиональным юмором (${profession.name})`;
            resultsDiv.appendChild(title);

            const packagesDiv = document.createElement('div');
            packagesDiv.className = 'packages';

            const basicPackage = document.createElement('div');
            basicPackage.className = 'package basic';
            basicPackage.innerHTML = `
                <div class="package-header">
                    <div class="package-title">📷 Базовый набор (${profession.name})</div>
                    <div class="package-price">299 ₽</div>
                </div>
                <div class="stickers-grid" id="pngGrid"></div>
                <button class="download-btn" onclick="downloadAll('png')">
                    📥 Скачать PNG (${pngStickers.length})
                </button>
            `;
            packagesDiv.appendChild(basicPackage);

            if (selectedPack === 'premium' && tgsStickers.length > 0) {
                const premiumPackage = document.createElement('div');
                premiumPackage.className = 'package premium';
                premiumPackage.innerHTML = `
                    <div class="package-header">
                        <div class="package-title">✨ Премиум набор (${profession.name})</div>
                        <div class="package-price">499 ₽</div>
                    </div>
                    <div class="stickers-grid" id="tgsGrid"></div>
                    <button class="download-btn premium" onclick="downloadAll('tgs')">
                        📥 Скачать TGS (${tgsStickers.length})
                    </button>
                `;
                packagesDiv.appendChild(premiumPackage);
            }

            resultsDiv.appendChild(packagesDiv);

            const pngGrid = document.getElementById('pngGrid');
            pngStickers.forEach(s => {
                const card = document.createElement('div');
                card.className = 'sticker-card';
                card.innerHTML = `
                    <div class="sticker-preview">
                        <img src="${s.dataUrl}" alt="${s.emotion.name}">
                    </div>
                    <div class="sticker-info">${s.emotion.icon} ${s.emotion.name}</div>
                    ${s.humor ? `<div style="font-size: 0.6em; color: #fbbf24; margin-top: 2px;">${s.humor.substring(0, 20)}...</div>` : ''}
                    <span class="sticker-badge png">PNG</span>
                `;
                pngGrid.appendChild(card);
            });

            if (selectedPack === 'premium' && tgsStickers.length > 0) {
                const tgsGrid = document.getElementById('tgsGrid');
                tgsStickers.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'sticker-card premium';
                    
                    card.innerHTML = `
                        <div class="sticker-preview">
                            <img src="${s.dataUrl}" alt="${s.emotion.name}">
                        </div>
                        <div class="sticker-info">${s.emotion.icon} ${s.emotion.name}</div>
                        ${s.humor ? `<div style="font-size: 0.6em; color: #fbbf24; margin-top: 2px;">${s.humor.substring(0, 20)}...</div>` : ''}
                        <span class="sticker-badge tgs">TGS</span>
                        <span class="sticker-badge api">Анимировано</span>
                    `;
                    tgsGrid.appendChild(card);
                });
            }

            document.getElementById('telegramGuide').style.display = 'block';
        }

        window.downloadAll = (type) => {
            const stickers = type === 'png' ? generatedPNG : generatedTGS;
            stickers.forEach(s => {
                const link = document.createElement('a');
                link.download = s.filename;
                link.href = s.dataUrl;
                link.click();
            });
            alert(`Скачивание ${stickers.length} файлов начато!`);
        };

        // ========== ИСТОРИЯ ==========
        function loadHistory() {
            const saved = localStorage.getItem('stickerHistory');
            if (saved) {
                generationHistory = JSON.parse(saved);
            }
            renderHistory();
        }

        function saveHistory() {
            localStorage.setItem('stickerHistory', JSON.stringify(generationHistory));
            renderHistory();
        }

        function addToHistory(character, profession, style, emotionsCount, pngStickers, tgsStickers, packType) {
            const entry = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                character: character,
                profession: profession.name,
                professionIcon: profession.icon,
                style: style,
                emotions: emotionsCount,
                packType: packType,
                pngCount: pngStickers.length,
                tgsCount: tgsStickers.length,
                previews: pngStickers.slice(0, 5).map(s => s.dataUrl)
            };
            
            generationHistory.unshift(entry);
            if (generationHistory.length > 50) {
                generationHistory = generationHistory.slice(0, 50);
            }
            
            saveHistory();
        }

        function clearHistory() {
            if (confirm('Очистить всю историю генераций?')) {
                generationHistory = [];
                localStorage.removeItem('stickerHistory');
                renderHistory();
            }
        }

        function regenerateFromHistory(entry) {
            document.getElementById('characterPrompt').value = entry.character;
            
            const profession = PROFESSIONS.find(p => p.name === entry.profession);
            if (profession) {
                selectProfession(profession.id);
            }
            
            document.querySelectorAll('.style-tag').forEach(tag => {
                if (entry.style.includes(tag.textContent)) {
                    tag.click();
                }
            });
            
            selectedEmotions = [];
            document.querySelectorAll('.emotion-item input').forEach((checkbox, index) => {
                if (index < 5) {
                    checkbox.checked = true;
                    toggleEmotion(checkbox.value, true);
                }
            });
            
            switchTab('generator');
            document.querySelector('.creator-card').scrollIntoView({ behavior: 'smooth' });
        }

        function renderHistory() {
            const grid = document.getElementById('historyGrid');
            if (!grid) return;
            
            if (generationHistory.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #4a5568;">История пуста. Создайте первый набор стикеров!</div>';
                return;
            }
            
            grid.innerHTML = generationHistory.map(entry => {
                const entryStr = JSON.stringify(entry).replace(/"/g, '&quot;');
                return `
                <div class="history-card">
                    <div class="history-date">📅 ${entry.date}</div>
                    <div class="history-prompt">
                        <strong>${entry.professionIcon} ${entry.profession}</strong><br>
                        <strong>Персонаж:</strong> ${entry.character}<br>
                        <strong>Стиль:</strong> ${entry.style}<br>
                        <strong>Эмоций:</strong> ${entry.emotions}
                    </div>
                    <div class="history-previews">
                        ${entry.previews.map(url => `
                            <div class="history-preview">
                                <img src="${url}" alt="preview">
                            </div>
                        `).join('')}
                    </div>
                    <div class="history-actions">
                        <button class="history-btn edit" onclick='regenerateFromHistory(${entryStr})'>
                            ✏️ Редактировать
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'generator') {
                document.querySelector('.tab').classList.add('active');
                document.getElementById('generator-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('history-tab').classList.add('active');
                renderHistory();
            }
        }

        // Проверка Recraft API
        async function checkRecraftAPI() {
            const statusDiv = document.getElementById('recraftStatus');
            
            try {
                const response = await fetch('https://external.api.recraft.ai/v1/images/generations', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${RECRAFT_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: 'test',
                        n: 1,
                        size: '1024x1024'
                    })
                });

                if (response.ok) {
                    statusDiv.className = 'api-status recraft';
                    statusDiv.innerHTML = '<span class="status-icon">✅</span><span>Recraft AI: Подключен</span>';
                } else {
                    statusDiv.className = 'api-status recraft error';
                    statusDiv.innerHTML = '<span class="status-icon">⚠️</span><span>Recraft AI: Демо режим</span>';
                }
            } catch (error) {
                statusDiv.className = 'api-status recraft error';
                statusDiv.innerHTML = '<span class="status-icon">⚠️</span><span>Recraft AI: Демо режим</span>';
            }
        }

        // Проверка Roboflow API
        async function checkRoboflowAPI() {
            const statusDiv = document.getElementById('roboflowStatus');
            
            try {
                const testImage = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
                const base64Data = testImage.split(',')[1];
                
                const response = await fetch(`https://detect.roboflow.com/${ROBOFLOW_MODEL}?api_key=${ROBOFLOW_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: base64Data
                });
                
                if (response.ok) {
                    statusDiv.className = 'api-status roboflow';
                    statusDiv.innerHTML = '<span class="status-icon">✅</span><span>Roboflow API: Подключен</span>';
                } else {
                    statusDiv.className = 'api-status roboflow';
                    statusDiv.innerHTML = '<span class="status-icon">⚠️</span><span>Roboflow API: Демо-режим</span>';
                }
                
            } catch (error) {
                statusDiv.className = 'api-status roboflow';
                statusDiv.innerHTML = '<span class="status-icon">⚠️</span><span>Roboflow API: Демо-режим</span>';
            }
        }

        // Инициализация
        renderProfessions();
        renderEmotions();
        checkRecraftAPI();
        checkRoboflowAPI();
        loadHistory();

        setTimeout(() => {
            EMOTIONS.slice(0, 5).forEach(emotion => {
                const checkbox = document.querySelector(`input[value="${emotion.id}"]`);
                if (checkbox) {
                    checkbox.checked = true;
                    toggleEmotion(emotion.id, true);
                }
            });
            
            selectProfession('zoomer');
        }, 100);
    </script>
