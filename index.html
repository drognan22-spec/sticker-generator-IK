<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGS - РАБОЧАЯ АНИМАЦИЯ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(145deg, #0B1120 0%, #192132 100%);
            min-height: 100vh;
            padding: 30px 20px;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 3em;
            background: linear-gradient(145deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 48px;
            padding: 40px;
            color: #1a1f2e;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        button {
            padding: 20px;
            border: none;
            border-radius: 30px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            background: #667eea;
            color: white;
        }
        button:hover {
            transform: scale(1.05);
        }
        .debug {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            color: #e2e8f0;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .success { color: #4ade80; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🎯 TGS WORKING</h1>
        
        <div class="card">
            <div class="button-grid">
                <button onclick="testSimple()">1. Простая пульсация</button>
                <button onclick="testBounce()">2. Прыгающий мяч</button>
                <button onclick="testSpin()">3. Вращение</button>
                <button onclick="testBlink()">4. Мигание</button>
            </div>
            
            <div class="debug" id="debug"></div>
        </div>
    </div>

    <script>
        function log(msg) {
            const debug = document.getElementById('debug');
            const timestamp = new Date().toLocaleTimeString();
            debug.innerHTML += `<div><span style="color: #fbbf24;">[${timestamp}]</span> <span style="color: #4ade80;">${msg}</span></div>`;
            debug.scrollTop = debug.scrollHeight;
        }

        // ========== ТЕСТ 1: ПРОСТАЯ ПУЛЬСАЦИЯ ==========
        async function testSimple() {
            log('📏 Тест 1: Пульсация');
            
            const lottie = {
                "tgs": 1,
                "v": "5.5.2",
                "fr": 30,
                "ip": 0,
                "op": 90,
                "w": 512,
                "h": 512,
                "nm": "Pulse",
                "ddd": 0,
                "assets": [],
                "layers": [
                    {
                        "ddd": 0,
                        "ind": 1,
                        "ty": 4,
                        "nm": "Circle",
                        "sr": 1,
                        "ks": {
                            "o": { "a": 0, "k": 100 },
                            "r": { "a": 0, "k": 0 },
                            "p": { "a": 0, "k": [256, 256, 0] },
                            "a": { "a": 0, "k": [0, 0, 0] },
                            "s": {
                                "a": 1,
                                "k": [
                                    {
                                        "t": 0,
                                        "s": [100, 100, 100]
                                    },
                                    {
                                        "t": 30,
                                        "s": [150, 150, 100]
                                    },
                                    {
                                        "t": 60,
                                        "s": [100, 100, 100]
                                    },
                                    {
                                        "t": 90,
                                        "s": [100, 100, 100]
                                    }
                                ]
                            }
                        },
                        "shapes": [
                            {
                                "ty": "gr",
                                "it": [
                                    {
                                        "ty": "el",
                                        "p": { "a": 0, "k": [0, 0] },
                                        "s": { "a": 0, "k": [200, 200] }
                                    },
                                    {
                                        "ty": "fl",
                                        "c": { "a": 0, "k": [1, 0, 0, 1] },
                                        "o": { "a": 0, "k": 100 }
                                    }
                                ]
                            }
                        ],
                        "ip": 0,
                        "op": 90
                    }
                ]
            };
            
            await saveTGS(lottie, 'test1_pulse.tgs');
        }

        // ========== ТЕСТ 2: ПРЫГАЮЩИЙ МЯЧ ==========
        async function testBounce() {
            log('🏀 Тест 2: Прыгающий мяч');
            
            const lottie = {
                "tgs": 1,
                "v": "5.5.2",
                "fr": 30,
                "ip": 0,
                "op": 90,
                "w": 512,
                "h": 512,
                "nm": "Bounce",
                "ddd": 0,
                "assets": [],
                "layers": [
                    {
                        "ddd": 0,
                        "ind": 1,
                        "ty": 4,
                        "nm": "Ball",
                        "sr": 1,
                        "ks": {
                            "o": { "a": 0, "k": 100 },
                            "r": { "a": 0, "k": 0 },
                            "p": {
                                "a": 1,
                                "k": [
                                    {
                                        "t": 0,
                                        "s": [256, 100, 0]
                                    },
                                    {
                                        "t": 30,
                                        "s": [256, 356, 0]
                                    },
                                    {
                                        "t": 60,
                                        "s": [256, 100, 0]
                                    },
                                    {
                                        "t": 90,
                                        "s": [256, 100, 0]
                                    }
                                ]
                            },
                            "a": { "a": 0, "k": [0, 0, 0] },
                            "s": {
                                "a": 1,
                                "k": [
                                    {
                                        "t": 0,
                                        "s": [100, 100, 100]
                                    },
                                    {
                                        "t": 30,
                                        "s": [120, 80, 100]
                                    },
                                    {
                                        "t": 60,
                                        "s": [100, 100, 100]
                                    }
                                ]
                            }
                        },
                        "shapes": [
                            {
                                "ty": "gr",
                                "it": [
                                    {
                                        "ty": "el",
                                        "p": { "a": 0, "k": [0, 0] },
                                        "s": { "a": 0, "k": [150, 150] }
                                    },
                                    {
                                        "ty": "fl",
                                        "c": { "a": 0, "k": [0, 0, 1, 1] },
                                        "o": { "a": 0, "k": 100 }
                                    }
                                ]
                            }
                        ],
                        "ip": 0,
                        "op": 90
                    }
                ]
            };
            
            await saveTGS(lottie, 'test2_bounce.tgs');
        }

        // ========== ТЕСТ 3: ВРАЩЕНИЕ ==========
        async function testSpin() {
            log('🔄 Тест 3: Вращение');
            
            const lottie = {
                "tgs": 1,
                "v": "5.5.2",
                "fr": 30,
                "ip": 0,
                "op": 120,
                "w": 512,
                "h": 512,
                "nm": "Spin",
                "ddd": 0,
                "assets": [],
                "layers": [
                    {
                        "ddd": 0,
                        "ind": 1,
                        "ty": 4,
                        "nm": "Spinner",
                        "sr": 1,
                        "ks": {
                            "o": { "a": 0, "k": 100 },
                            "r": {
                                "a": 1,
                                "k": [
                                    {
                                        "t": 0,
                                        "s": [0]
                                    },
                                    {
                                        "t": 60,
                                        "s": [180]
                                    },
                                    {
                                        "t": 120,
                                        "s": [360]
                                    }
                                ]
                            },
                            "p": { "a": 0, "k": [256, 256, 0] },
                            "a": { "a": 0, "k": [128, 128, 0] },
                            "s": { "a": 0, "k": [100, 100, 100] }
                        },
                        "shapes": [
                            {
                                "ty": "gr",
                                "it": [
                                    {
                                        "ty": "rc",
                                        "s": { "a": 0, "k": [200, 200] },
                                        "p": { "a": 0, "k": [0, 0] },
                                        "r": { "a": 0, "k": 30 }
                                    },
                                    {
                                        "ty": "fl",
                                        "c": { "a": 0, "k": [1, 1, 0, 1] },
                                        "o": { "a": 0, "k": 100 }
                                    }
                                ]
                            }
                        ],
                        "ip": 0,
                        "op": 120
                    }
                ]
            };
            
            await saveTGS(lottie, 'test3_spin.tgs');

        // ========== ТЕСТ 4: МИГАНИЕ ==========
        async function testBlink() {
            log('👁️ Тест 4: Мигание');
            
            const lottie = {
                "tgs": 1,
                "v": "5.5.2",
                "fr": 30,
                "ip": 0,
                "op": 90,
                "w": 512,
                "h": 512,
                "nm": "Blink",
                "ddd": 0,
                "assets": [],
                "layers": [
                    {
                        "ddd": 0,
                        "ind": 1,
                        "ty": 4,
                        "nm": "Blinker",
                        "sr": 1,
                        "ks": {
                            "o": {
                                "a": 1,
                                "k": [
                                    {
                                        "t": 0,
                                        "s": [100]
                                    },
                                    {
                                        "t": 15,
                                        "s": [0]
                                    },
                                    {
                                        "t": 30,
                                        "s": [100]
                                    },
                                    {
                                        "t": 45,
                                        "s": [0]
                                    },
                                    {
                                        "t": 60,
                                        "s": [100]
                                    },
                                    {
                                        "t": 75,
                                        "s": [0]
                                    },
                                    {
                                        "t": 90,
                                        "s": [100]
                                    }
                                ]
                            },
                            "r": { "a": 0, "k": 0 },
                            "p": { "a": 0, "k": [256, 256, 0] },
                            "a": { "a": 0, "k": [0, 0, 0] },
                            "s": { "a": 0, "k": [100, 100, 100] }
                        },
                        "shapes": [
                            {
                                "ty": "gr",
                                "it": [
                                    {
                                        "ty": "el",
                                        "p": { "a": 0, "k": [0, 0] },
                                        "s": { "a": 0, "k": [200, 200] }
                                    },
                                    {
                                        "ty": "fl",
                                        "c": { "a": 0, "k": [0, 1, 0, 1] },
                                        "o": { "a": 0, "k": 100 }
                                    }
                                ]
                            }
                        ],
                        "ip": 0,
                        "op": 90
                    }
                ]
            };
            
            await saveTGS(lottie, 'test4_blink.tgs');
        }

        async function saveTGS(lottieJson, filename) {
            try {
                log(`📦 JSON размер: ${JSON.stringify(lottieJson).length} байт`);
                
                // Сжимаем
                const jsonString = JSON.stringify(lottieJson);
                const compressed = pako.gzip(jsonString, { level: 9 });
                log(`✅ Сжато: ${jsonString.length} → ${compressed.length} байт`);
                
                // Сохраняем
                const blob = new Blob([compressed], { type: 'application/x-tgsticker' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                link.click();
                URL.revokeObjectURL(url);
                
                log(`✅ Файл сохранен: ${filename}`);
                
            } catch (e) {
                log(`❌ Ошибка: ${e.message}`);
            }
        }

        log('✅ TGS тестер готов');
        log('Нажимайте кнопки и проверяйте в Telegram');
    </script>
</body>
</html>
