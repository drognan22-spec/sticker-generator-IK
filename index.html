<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGS TEST - ПРОСТАЯ АНИМАЦИЯ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(145deg, #0B1120 0%, #192132 100%);
            min-height: 100vh;
            padding: 30px 20px;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 3em;
            background: linear-gradient(145deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 48px;
            padding: 40px;
            color: #1a1f2e;
        }
        .api-status {
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 20px;
            background: #f0f9ff;
            border: 2px solid #38bdf8;
        }
        .debug-panel {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            color: #e2e8f0;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin: 20px 0;
        }
        .success { color: #4ade80; }
        .error { color: #ef4444; }
        button {
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 40px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 10px;
        }
        button.test {
            background: linear-gradient(145deg, #fbbf24, #f59e0b);
            color: #1a1f2e;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 TGS TEST</h1>
            <p>Проверка простой анимации</p>
        </div>
        
        <div class="card">
            <div id="apiStatus" class="api-status">
                <span>✅ Библиотеки загружены</span>
            </div>
            
            <button onclick="testSimpleTGS()" class="test">
                🧪 1. Тест №1 - Красный квадрат
            </button>
            
            <button onclick="testCircleTGS()">
                ⭕ 2. Тест №2 - Синий круг
            </button>
            
            <button onclick="testTextTGS()">
                📝 3. Тест №3 - Текст "ПРИВЕТ"
            </button>
            
            <button onclick="testFullTGS()">
                ✨ 4. Тест №4 - ВСЁ ВМЕСТЕ
            </button>
            
            <div id="debugPanel" class="debug-panel">
                <div id="debugLogs"></div>
            </div>
        </div>
    </div>

    <script>
        function addLog(message, type = 'info') {
            const logs = document.getElementById('debugLogs');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'success' ? '#4ade80' : (type === 'error' ? '#ef4444' : '#38bdf8');
            logs.innerHTML += `<div><span style="color: #fbbf24;">[${timestamp}]</span> <span style="color: ${color};">${message}</span></div>`;
            logs.scrollTop = logs.scrollHeight;
        }

        // ========== ТЕСТ №1 - КРАСНЫЙ КВАДРАТ ==========
        async function testSimpleTGS() {
            addLog('🧪 Тест №1: Красный квадрат с пульсацией');
            
            // Минимальный рабочий TGS
            const lottie = {
                tgs: 1,              // Обязательно для Telegram
                v: "5.5.2",           // Версия
                fr: 30,               // 30 FPS (надежно)
                ip: 0,                 // Начальный кадр
                op: 60,                // Конечный кадр (2 секунды при 30 fps)
                w: 512,                // Ширина
                h: 512,                // Высота
                ddd: 0,                // 2D
                layers: [{
                    ddd: 0,
                    ind: 1,
                    ty: 4,              // Shape layer
                    nm: "red_square",
                    sr: 1,
                    ks: {
                        o: { a: 0, k: 100 },     // Opacity
                        r: { a: 0, k: 0 },        // Rotation
                        p: { a: 0, k: [256, 256, 0] }, // Position
                        a: { a: 0, k: [0, 0, 0] }, // Anchor
                        s: {                       // Scale с анимацией
                            a: 1,
                            k: [
                                { t: 0, s: [100, 100, 100] },
                                { t: 15, s: [120, 120, 100] },
                                { t: 30, s: [80, 80, 100] },
                                { t: 45, s: [110, 110, 100] },
                                { t: 60, s: [100, 100, 100] }
                            ]
                        }
                    },
                    shapes: [{
                        ty: "gr",
                        it: [
                            {
                                ty: "rc",          // Прямоугольник
                                d: 1,
                                s: { a: 0, k: [300, 300] }, // Size
                                p: { a: 0, k: [256, 256] }, // Position
                                r: { a: 0, k: 0 }           // Roundness
                            },
                            {
                                ty: "fl",          // Заливка
                                c: { a: 0, k: [1, 0, 0, 1] }, // Красный
                                o: { a: 0, k: 100 }
                            }
                        ],
                        nm: "square_group"
                    }],
                    ip: 0,
                    op: 60
                }]
            };
            
            await saveTGS(lottie, 'test1_red_square.tgs');
        }

        // ========== ТЕСТ №2 - СИНИЙ КРУГ ==========
        async function testCircleTGS() {
            addLog('🧪 Тест №2: Синий круг с движением');
            
            const lottie = {
                tgs: 1,
                v: "5.5.2",
                fr: 30,
                ip: 0,
                op: 60,
                w: 512,
                h: 512,
                ddd: 0,
                layers: [{
                    ddd: 0,
                    ind: 1,
                    ty: 4,
                    nm: "blue_circle",
                    sr: 1,
                    ks: {
                        o: { a: 0, k: 100 },
                        r: { a: 0, k: 0 },
                        p: {                       // Position с анимацией
                            a: 1,
                            k: [
                                { t: 0, s: [256, 256, 0] },
                                { t: 15, s: [356, 256, 0] },
                                { t: 30, s: [256, 356, 0] },
                                { t: 45, s: [156, 256, 0] },
                                { t: 60, s: [256, 156, 0] },
                                { t: 75, s: [256, 256, 0] }
                            ]
                        },
                        a: { a: 0, k: [0, 0, 0] },
                        s: { a: 0, k: [100, 100, 100] }
                    },
                    shapes: [{
                        ty: "gr",
                        it: [
                            {
                                ty: "el",          // Эллипс/круг
                                d: 1,
                                p: { a: 0, k: [0, 0] },
                                s: { a: 0, k: [200, 200] }
                            },
                            {
                                ty: "fl",
                                c: { a: 0, k: [0, 0, 1, 1] }, // Синий
                                o: { a: 0, k: 100 }
                            }
                        ],
                        nm: "circle_group"
                    }],
                    ip: 0,
                    op: 75
                }]
            };
            
            await saveTGS(lottie, 'test2_blue_circle.tgs');
        }

        // ========== ТЕСТ №3 - ТЕКСТ ==========
        async function testTextTGS() {
            addLog('🧪 Тест №3: Текст "ПРИВЕТ"');
            
            const lottie = {
                tgs: 1,
                v: "5.5.2",
                fr: 30,
                ip: 0,
                op: 60,
                w: 512,
                h: 512,
                ddd: 0,
                layers: [{
                    ddd: 0,
                    ind: 1,
                    ty: 5,              // Тип 5 = текстовый слой
                    nm: "text_layer",
                    sr: 1,
                    ks: {
                        o: { a: 1, k: [    // Opacity с анимацией
                            { t: 0, s: [100] },
                            { t: 15, s: [50] },
                            { t: 30, s: [100] },
                            { t: 45, s: [50] },
                            { t: 60, s: [100] }
                        ]},
                        r: { a: 0, k: 0 },
                        p: { a: 0, k: [256, 256, 0] },
                        a: { a: 0, k: [0, 0, 0] },
                        s: { a: 1, k: [    // Scale с анимацией
                            { t: 0, s: [100, 100, 100] },
                            { t: 30, s: [150, 150, 100] },
                            { t: 60, s: [100, 100, 100] }
                        ]}
                    },
                    t: {
                        d: {
                            k: [{
                                t: 0,
                                s: {
                                    f: "Arial",           // Шрифт
                                    s: 60,                 // Размер
                                    fc: [1, 0, 0, 1],      // Красный цвет
                                    j: 2,                  // Выравнивание по центру
                                    tr: 0,
                                    lh: 60,
                                    ls: 0,
                                    t: "ПРИВЕТ"            // Текст
                                }
                            }]
                        }
                    },
                    ip: 0,
                    op: 60
                }]
            };
            
            await saveTGS(lottie, 'test3_text.tgs');
        }

        // ========== ТЕСТ №4 - ВСЁ ВМЕСТЕ ==========
        async function testFullTGS() {
            addLog('🧪 Тест №4: Комбинированный стикер');
            
            const lottie = {
                tgs: 1,
                v: "5.5.2",
                fr: 30,
                ip: 0,
                op: 90,
                w: 512,
                h: 512,
                ddd: 0,
                layers: [
                    // Слой 1: Красный квадрат (фон)
                    {
                        ddd: 0,
                        ind: 1,
                        ty: 4,
                        nm: "background",
                        sr: 1,
                        ks: {
                            o: { a: 0, k: 100 },
                            r: { a: 0, k: 0 },
                            p: { a: 0, k: [256, 256, 0] },
                            a: { a: 0, k: [0, 0, 0] },
                            s: { a: 1, k: [
                                { t: 0, s: [100, 100, 100] },
                                { t: 45, s: [110, 110, 100] },
                                { t: 90, s: [100, 100, 100] }
                            ]}
                        },
                        shapes: [{
                            ty: "gr",
                            it: [
                                {
                                    ty: "rc",
                                    s: { a: 0, k: [400, 400] },
                                    p: { a: 0, k: [256, 256] },
                                    r: { a: 0, k: 50 }
                                },
                                {
                                    ty: "fl",
                                    c: { a: 0, k: [1, 0, 0, 1] }
                                }
                            ]
                        }],
                        ip: 0,
                        op: 90
                    },
                    // Слой 2: Синий круг (передний план)
                    {
                        ddd: 0,
                        ind: 2,
                        ty: 4,
                        nm: "foreground",
                        sr: 1,
                        ks: {
                            o: { a: 1, k: [
                                { t: 0, s: [100] },
                                { t: 45, s: [50] },
                                { t: 90, s: [100] }
                            ]},
                            r: { a: 1, k: [
                                { t: 0, s: [0] },
                                { t: 45, s: [360] },
                                { t: 90, s: [0] }
                            ]},
                            p: { a: 1, k: [
                                { t: 0, s: [256, 256, 0] },
                                { t: 30, s: [356, 256, 0] },
                                { t: 60, s: [156, 256, 0] },
                                { t: 90, s: [256, 256, 0] }
                            ]},
                            a: { a: 0, k: [0, 0, 0] },
                            s: { a: 0, k: [100, 100, 100] }
                        },
                        shapes: [{
                            ty: "gr",
                            it: [
                                {
                                    ty: "el",
                                    p: { a: 0, k: [0, 0] },
                                    s: { a: 0, k: [150, 150] }
                                },
                                {
                                    ty: "fl",
                                    c: { a: 0, k: [0, 0, 1, 1] }
                                }
                            ]
                        }],
                        ip: 0,
                        op: 90
                    },
                    // Слой 3: Текст
                    {
                        ddd: 0,
                        ind: 3,
                        ty: 5,
                        nm: "text",
                        sr: 1,
                        ks: {
                            o: { a: 0, k: 100 },
                            r: { a: 0, k: 0 },
                            p: { a: 0, k: [256, 400, 0] },
                            a: { a: 0, k: [0, 0, 0] },
                            s: { a: 0, k: [100, 100, 100] }
                        },
                        t: {
                            d: {
                                k: [{
                                    t: 0,
                                    s: {
                                        f: "Arial",
                                        s: 40,
                                        fc: [1, 1, 1, 1], // Белый
                                        j: 2,
                                        t: "TGS WORKS!"
                                    }
                                }]
                            }
                        },
                        ip: 0,
                        op: 90
                    }
                ]
            };
            
            await saveTGS(lottie, 'test4_full.tgs');
        }

        // ========== СОХРАНЕНИЕ TGS ==========
        async function saveTGS(lottieJson, filename) {
            try {
                // Проверяем структуру
                addLog(`📦 JSON размер: ${JSON.stringify(lottieJson).length} байт`);
                addLog(`📊 Слоев: ${lottieJson.layers.length}`);
                
                // Сжимаем GZIP
                const jsonString = JSON.stringify(lottieJson);
                const compressed = pako.gzip(jsonString, { level: 9 });
                addLog(`✅ Сжато: ${jsonString.length} → ${compressed.length} байт`);
                
                // Создаем blob
                const blob = new Blob([compressed], { type: 'application/x-tgsticker' });
                
                // Сохраняем файл
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                addLog(`✅ TGS сохранен: ${filename}`, 'success');
                
            } catch (e) {
                addLog(`❌ Ошибка: ${e.message}`, 'error');
            }
        }

        // Очистка логов
        function clearLogs() {
            document.getElementById('debugLogs').innerHTML = '';
        }

        addLog('✅ Готов к тестированию');
        addLog('Нажимайте кнопки для создания TGS');
    </script>
</body>
</html>
